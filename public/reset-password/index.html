<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password</title>
  <link rel="icon" href="/assets/icon-32.png" sizes="32x32" />
  <link rel="icon" href="/assets/icon-192.png" sizes="192x192" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f6f8fb" />
  <meta name="description" content="Reset your afterschool program password" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Afterschool" />
  <link rel="apple-touch-icon" href="/assets/icon-192.png" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&family=Raleway:wght@300&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Figtree', system-ui, sans-serif; background: #f6f8fb; color: #141b2b;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { width: 100%; max-width: 400px; }
    .logo { text-align: center; margin-bottom: 28px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .logo img { max-height: 2.5rem; width: auto; max-width: 11rem; object-fit: contain; }
    .wordmark { font-family: 'Raleway', system-ui, sans-serif; font-weight: 300;
                letter-spacing: 0.34em; font-size: 1.5rem; color: #141b2b; }
    .sub-brand { font-size: 0.6rem; font-weight: 600; text-transform: uppercase;
                 letter-spacing: 0.3em; color: #64748b; }
    h1 { font-size: 1.6rem; font-weight: 800; text-align: center; margin-bottom: 6px; }
    p.sub { color: #64748b; font-size: 0.97rem; font-weight: 500; text-align: center; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.875rem; font-weight: 700; color: #364152; margin-bottom: 6px; }
    input { width: 100%; padding: 13px 16px; border: 2px solid #e2e8f0; border-radius: 16px;
            font-family: inherit; font-size: 1rem; font-weight: 500; outline: none; transition: border 0.2s; }
    input:focus { border-color: #2f6fed; }
    .btn { width: 100%; padding: 15px; background: #2f6fed; color: white; border: none;
           border-radius: 999px; font-family: inherit; font-size: 1.05rem; font-weight: 800; cursor: pointer; }
    .btn:hover { background: #2058ce; }
    .error { background: #ffeef2; color: #bd1239; padding: 12px 16px; border-radius: 14px; font-size: 0.9rem; font-weight: 600; margin-bottom: 14px; display: none; }
    .success { background: #e8f9ef; color: #12833c; padding: 12px 16px; border-radius: 14px; font-size: 0.9rem; font-weight: 600; margin-bottom: 14px; display: none; }
    .back-link { text-align: center; margin-top: 18px; font-size: 0.9rem; font-weight: 700; }
    .back-link a { color: #4a5568; text-decoration: none; }
    #step-request, #step-reset { }
    #step-reset { display: none; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo" id="logo"><span class="wordmark">KIKAR</span><span class="sub-brand">Afterschool</span></div>

  <!-- Step 1: Request reset -->
  <div id="step-request">
    <h1>Forgot password</h1>
    <p class="sub">Enter your email and we'll send you a reset link.</p>
    <div class="error" id="req-error"></div>
    <div class="success" id="req-success"></div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="req-email" placeholder="your@email.com" />
    </div>
    <button class="btn" onclick="requestReset()">Send reset link</button>
    <div class="back-link"><a href="/app/login">← Back to sign in</a></div>
  </div>

  <!-- Step 2: Set new password (when opened via token link) -->
  <div id="step-reset">
    <h1>Create a new password</h1>
    <p class="sub">Choose a new password for your account.</p>
    <div class="error" id="res-error"></div>
    <div class="success" id="res-success"></div>
    <div class="form-group">
      <label>New Password</label>
      <input type="password" id="res-pw" placeholder="At least 6 characters" />
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="res-pw2" placeholder="Repeat new password" />
    </div>
    <button class="btn" id="res-btn" onclick="doReset()">Update Password</button>
    <div class="back-link"><a href="/app/login">← Back to sign in</a></div>
  </div>
</div>

<script>
// No session here — this page must work for someone who cannot sign in — so
// it asks the same public endpoint the login screen does. Falls back to the
// static KIKAR wordmark already in the markup on any failure.
fetch('/api/public/branding').then((r) => r.json()).then((b) => {
  if (b.name) document.title = 'Reset password – ' + b.name;
  const el = document.getElementById('logo');
  if (b.logo_url) {
    const img = document.createElement('img');
    img.src = b.logo_url;
    img.alt = b.name || '';
    el.replaceChildren(img);
  } else if (b.name) {
    const span = document.createElement('span');
    span.className = 'wordmark';
    span.style.letterSpacing = 'normal';
    span.textContent = b.name;
    el.replaceChildren(span);
  }
}).catch(() => {});

const params = new URLSearchParams(window.location.search);
const resetToken = params.get('token');

if (resetToken) {
  document.getElementById('step-request').style.display = 'none';
  document.getElementById('step-reset').style.display = 'block';
}

async function requestReset() {
  const email = document.getElementById('req-email').value.trim();
  const errEl = document.getElementById('req-error');
  const okEl = document.getElementById('req-success');
  errEl.style.display = 'none'; okEl.style.display = 'none';
  if (!email) { errEl.textContent = 'Please enter your email.'; errEl.style.display = 'block'; return; }

  const res = await fetch('/api/auth/forgot-password', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email })
  });
  const data = await res.json();
  okEl.textContent = 'If that email exists in our system, a reset link has been sent.';
  okEl.style.display = 'block';
}

async function doReset() {
  const pw = document.getElementById('res-pw').value;
  const pw2 = document.getElementById('res-pw2').value;
  const errEl = document.getElementById('res-error');
  const okEl = document.getElementById('res-success');
  errEl.style.display = 'none'; okEl.style.display = 'none';

  if (pw !== pw2) { errEl.textContent = 'Passwords do not match.'; errEl.style.display = 'block'; return; }
  if (pw.length < 8) { errEl.textContent = 'Password must be at least 8 characters.'; errEl.style.display = 'block'; return; }
  if (!/[A-Z]/.test(pw)) { errEl.textContent = 'Password must contain at least one uppercase letter.'; errEl.style.display = 'block'; return; }
  if (!/[!@#$%^&*()_+\-=\[\]{}|;:'",.<>?/\\`~]/.test(pw)) { errEl.textContent = 'Password must contain at least one special character (!@#$%^&* etc.).'; errEl.style.display = 'block'; return; }

  const res = await fetch('/api/auth/reset-password', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: resetToken, new_password: pw })
  });
  const data = await res.json();
  if (!res.ok) { errEl.textContent = data.error; errEl.style.display = 'block'; return; }

  // Always the SPA's single login, never a per-role destination.
  //
  // This used to map the role onto /parent, /counselor or /admin. Two of those
  // redirect into the app, but /admin still serves the legacy portal — so an
  // administrator who had just set a password landed on a second, older login
  // screen offering to "go back to portal selection", a concept that no longer
  // exists. The app already routes by role once you are signed in (homeFor in
  // web/src/App.tsx); this page has no business knowing roles at all.
  const destination = '/app/login';
  okEl.innerHTML = `✅ Password updated! Taking you to sign in… <a href="${destination}" style="color:#15803d;font-weight:600;">Go now →</a>`;
  okEl.style.display = 'block';
  document.getElementById('res-btn').disabled = true;
  setTimeout(() => { window.location.href = destination; }, 1500);
}
</script>
</body>
</html>
